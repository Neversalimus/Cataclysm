name: NCMM Runtime

on:
  workflow_dispatch:
  push:
    paths:
      - 'ncmm-platform/runtime/**'
      - 'ncmm-platform/mods/**'
      - 'ncmm-platform/sdk/**'
      - 'ncmm-platform/ci/Build-Runtime.ps1'
      - '.github/workflows/ncmm-runtime.yml'

permissions:
  contents: write

concurrency:
  group: ncmm-runtime-release
  cancel-in-progress: false

jobs:
  build-runtime:
    runs-on: windows-2022
    steps:
      - name: Checkout NCMM repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build runtime + AWS
        shell: powershell
        run: |
          ./ncmm-platform/ci/Build-Runtime.ps1 `
            -RepositoryRoot "$env:GITHUB_WORKSPACE/ncmm-platform" `
            -OutputRoot "$env:GITHUB_WORKSPACE/dist/runtime"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NCMM_Runtime_v0.3.0
          path: dist/NCMM_Runtime_v0.3.0.zip
          if-no-files-found: error

      - name: Publish runtime release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'ncmm-runtime-v0.3.0'
          cmd /c "gh release view $tag >nul 2>nul"
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title 'NCMM Runtime v0.3.0' --notes 'Portable NCMM runtime. No compiler or build tools are required on player PCs.'
            if ($LASTEXITCODE -ne 0) { throw 'Could not create runtime release.' }
          }
          gh release upload $tag 'dist/NCMM_Runtime_v0.3.0.zip' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload runtime package.' }
